name: Build GBAStation PPSSPP cores

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-switch:
    name: Nintendo Switch NRO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Check out PPSSPP source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Switch build dependencies
        shell: bash
        run: dkp-pacman -S --noconfirm --needed switch-dev switch-curl

      - name: Fetch latest release switchVK SDK
        id: switchvk-release
        shell: bash
        env:
          SWITCHVK_TOKEN: ${{ secrets.SWITCHVK_READ_TOKEN || github.token }}
          SWITCHVK_VARIANT: release
        run: bash ci/fetch-switchvk.sh "$RUNNER_TEMP/switchvk-sdk-release"

      - name: Prepare PPSSPP flash0 assets
        shell: bash
        run: |
          set -euo pipefail
          assets_commit=0f19aedc143be21a954231370e3a02ce03088994
          assets_archive="$RUNNER_TEMP/ppsspp-assets-${assets_commit}.tar.gz"
          assets_extract="$RUNNER_TEMP/ppsspp-assets-${assets_commit}"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://codeload.github.com/BadCaseDotOrg/PPSSPP_Assets/tar.gz/${assets_commit}" \
            --output "$assets_archive"
          mkdir -p "$assets_extract"
          tar -xzf "$assets_archive" -C "$assets_extract"

          flash0_source="$(find "$assets_extract" -type d -path '*/flash0' -print -quit)"
          test -n "$flash0_source"
          test -s "$flash0_source/font/ltn0.pgf"
          rm -rf assets/flash0
          install -d assets
          cp -a "$flash0_source" assets/flash0
          test "$(sha256sum assets/flash0/font/ltn0.pgf | awk '{print $1}')" = \
            "1184f16bc89bad1fea49093806784470281af54f279b57ef0378ce33e6603870"

      - name: Restore vendored libpng ARM sources
        shell: bash
        run: |
          set -euo pipefail
          libpng_revision=09b7a626660a8a8a4c6b100518a21a17d0170e83
          libpng_arm_dir=ext/libpng17/arm
          libpng_raw_base="https://raw.githubusercontent.com/hrydgard/ppsspp/${libpng_revision}/${libpng_arm_dir}"
          mkdir -p "$libpng_arm_dir"

          declare -A expected_sha1=(
            [arm_init.c]=9236798bee12782da9d6783163acb6b2ab7bdee0
            [filter_neon.S]=e111b6646e85659b61cbfd2c7ae77a11cd2cbb0f
            [filter_neon_intrinsics.c]=42635112e4dc58e17def9b8679a49698a1919dc4
            [neon.h]=ebd59b9fa04a81094c8bd5e22ccb2e0b89cd8624
          )
          for source_file in "${!expected_sha1[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors \
              "$libpng_raw_base/$source_file" \
              --output "$libpng_arm_dir/$source_file"
            test "$(sha1sum "$libpng_arm_dir/$source_file" | awk '{print $1}')" = \
              "${expected_sha1[$source_file]}"
          done

      - name: Build release NRO
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_local.sh build_ppsspp_GBAStation_nro.sh
          LIBRARY_PATH="$GITHUB_WORKSPACE/build_switch_GBAStation/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" \
          SWITCH_NVK_ROOT="${{ steps.switchvk-release.outputs.switch_nvk_root }}" \
            bash build_local.sh --clean -j "$(nproc)"
          test -s GBAStationPPSSPPStub.nro
          sha256sum GBAStationPPSSPPStub.nro > GBAStationPPSSPPStub.nro.sha256

      - name: Upload Nintendo Switch build
        uses: actions/upload-artifact@v4
        with:
          name: GBAStation-PPSSPP-Switch-${{ github.sha }}
          path: |
            GBAStationPPSSPPStub.nro
            GBAStationPPSSPPStub.nro.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish core release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-switch
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/GBAStationPPSSPPStub.nro
            release-assets/GBAStationPPSSPPStub.nro.sha256
